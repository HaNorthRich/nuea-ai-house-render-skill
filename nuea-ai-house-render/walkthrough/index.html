<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkthrough บ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Serif+Thai:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --hud: #effff9; --accent: #3cf2b0; --gold: #ffd24a; --glass: rgba(8, 12, 16, .58); --line: rgba(239, 255, 249, .38);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: #050607; overflow: hidden; }
body { display: grid; place-items: center; font-family: "Chakra Petch", "Sukhumvit Set", system-ui, sans-serif; color: var(--hud); }

/* 9:16 stage sized to the window height, so a screen recording crops straight to a Reel */
.stage { position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; overflow: hidden; background: #000; user-select: none; }
.shot { position: absolute; inset: 0; opacity: 0; transition: opacity .35s var(--ease); }
.shot.on { opacity: 1; }
.shot video, .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shot .game { clip-path: inset(0 100% 0 0); transition: clip-path .5s var(--ease); }
.stage.game .shot.on .game { clip-path: inset(0 0 0 0); }
.wait { position: absolute; left: 50%; top: 46%; translate: -50% 0; padding: .6vh 1.4vh; border-radius: 99px; font-size: 1.5vh;
        background: rgba(255, 90, 90, .85); color: #fff; display: none; }
.shot.nofilm .wait { display: block; }
.shot.nofilm video { display: none; }  /* no clip yet: the AI still underneath shows instead */

.dim { position: absolute; inset: 0; background: radial-gradient(transparent 30%, rgba(0,0,0,.75)); opacity: 0; transition: opacity .35s; pointer-events: none; }
.stage.travel .dim { opacity: 1; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.flash.on { animation: flash .55s ease-out; }
@keyframes flash { from { opacity: .8; } to { opacity: 0; } }
.vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 12vh rgba(0,0,0,.55); }

/* HUD */
.mode { position: absolute; top: 2.4vh; left: 2.4vh; font: 600 1.7vh "Noto Serif Thai", serif; text-shadow: 0 .2vh 1vh rgba(0,0,0,.7);
        opacity: 0; transition: opacity .2s; }
.stage.game .mode { opacity: 1; }

.map { position: absolute; top: 2.4vh; right: 2.2vh; width: 39%; aspect-ratio: 1; border: 2px solid var(--line); border-radius: 1.6vh;
       overflow: hidden; background: #111; box-shadow: 0 1vh 4vh rgba(0,0,0,.55); transition: all .5s var(--ease); z-index: 5; }
.stage.travel .map { width: 88%; top: 20vh; right: 6%; border-color: var(--accent); }
.map img { width: 100%; height: 100%; display: block; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.room { fill: transparent; cursor: pointer; transition: fill .2s; }
.room:hover { fill: rgba(60, 242, 176, .25); }
.room.cur { fill: rgba(60, 242, 176, .3); stroke: var(--accent); stroke-width: .007; }
.room.dest { fill: rgba(255, 210, 74, .32); stroke: var(--gold); stroke-width: .007; }
.room.off { fill: rgba(0, 0, 0, .5); cursor: default; }
.lbl { font: 700 .034px "Chakra Petch", sans-serif; fill: #fff; stroke: rgba(0,0,0,.75); stroke-width: .008px; paint-order: stroke;
       text-anchor: middle; dominant-baseline: middle; pointer-events: none; opacity: 0; transition: opacity .3s; }
.stage.travel .lbl { opacity: 1; }  /* minimap stays clean; names only when it opens up */
.lbl.off { fill: rgba(255,255,255,.55); }
.trail { display: none; }  /* only the moving point, no path line */
.dot { fill: var(--gold); stroke: #111; stroke-width: .006; }
.ring { fill: none; stroke: var(--gold); stroke-width: .006; animation: ring 1.4s infinite; }
@keyframes ring { from { r: .018px; opacity: 1; } to { r: .06px; opacity: 0; } }

/* room name: just the words, like a real-estate film title (no box, counter or progress bar) */
.card { position: absolute; left: 3.2vh; right: 3.2vh; bottom: 8vh; }
.card .name { font: 600 4.8vh/1.2 "Noto Serif Thai", serif; color: #fff; letter-spacing: .01em;
              text-shadow: 0 .3vh 2.4vh rgba(0,0,0,.55), 0 .1vh .4vh rgba(0,0,0,.4); }
.card.pop { animation: pop .9s cubic-bezier(.2, .8, .2, 1); }
@keyframes pop { from { transform: translateY(1.4vh); opacity: 0; filter: blur(.4vh); } to { transform: none; opacity: 1; filter: none; } }
.hint { position: absolute; left: 0; right: 0; bottom: 2.6vh; text-align: center; font-size: 1.45vh; color: rgba(239,255,249,.8); }
.hint kbd { font: inherit; padding: .1vh .7vh; border: 1px solid var(--line); border-radius: .5vh; background: rgba(0,0,0,.35); }
.stage.travel .card, .stage.travel .hint { opacity: 0; transition: opacity .2s; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="shots"></div>
  <div class="vignette"></div>
  <div class="dim"></div>
  <div class="flash" id="flash"></div>

  <div class="mode">ภาพจาก Blender</div>

  <div class="map" id="map">
    <img src="media/plan_top.png" alt="ผังบ้านมุมบน">
    <svg viewBox="0 0 1 1" id="mapsvg" aria-label="แผนที่บ้าน คลิกห้องเพื่อไป"></svg>
  </div>

  <div class="card" id="card"><div class="name" id="name"></div></div>
  <div class="hint">คลิกห้องบนแผนที่ · กด <kbd>B</kbd> ค้าง ดูภาพจาก Blender</div>
</div>

<script src="plan.js"></script>
<script>
// Rooms come from plan.js (written by scripts/plan_map.py): list = walkthrough order, rooms = rectangles, path = walking route.
// Per room: clip media/<id>.mp4 · still media/<id>_real.jpg · Blender view media/<id>_blender.jpg (shown while B is held).
// Optional per room in plan.js list: spot [u, v] + at <path index> for a place off the path (e.g. a carport).
const ROOMS = window.PLAN.list.map((r) => ({ ...r }));
const OFF = window.PLAN.off || {};  // {key: name}: on the map but no clip, shown dimmed and never clickable
const { path: PATH, rooms: RECT } = window.PLAN;
const $ = (id) => document.getElementById(id);
const stage = $("stage"), svg = $("mapsvg"), NS = "http://www.w3.org/2000/svg";
const center = (k) => { const [[x0, y0], [x1, y1]] = RECT[k]; return [(x0 + x1) / 2, (y0 + y1) / 2]; };
const nearest = ([cx, cy]) => PATH.reduce((b, [x, y], i) => {
  const d = (x - cx) ** 2 + (y - cy) ** 2; return d < b.d ? { i, d } : b;
}, { i: 0, d: Infinity }).i;
const el = (tag, attrs) => { const n = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v)); return n; };

// shots
const shots = ROOMS.map((r) => {
  const make = (tag, props) => Object.assign(document.createElement(tag), props);  // properties, never HTML: names stay text
  const wrap = make("div", { className: "shot" });
  const still = make("img", { className: "still", src: `media/${r.id}_real.jpg`, alt: `${r.name} ภาพสมจริง` });
  still.addEventListener("error", () => { still.src = `media/${r.id}_blender.jpg`; }, { once: true });
  const v = make("video", { muted: true, loop: true, playsInline: true, preload: "auto", src: `media/${r.id}.mp4` });
  wrap.append(still, v, make("img", { className: "game", src: `media/${r.id}_blender.jpg`, alt: `${r.name} จาก Blender` }),
    make("span", { className: "wait", textContent: "ยังไม่มีคลิป" }));
  v.addEventListener("error", () => wrap.classList.add("nofilm"));  // placeholder until the room's clip exists
  $("shots").appendChild(wrap);
  return { wrap, v };
});

// map: rooms, labels, trail, player
ROOMS.forEach((r, i) => {
  const [[x0, y0], [x1, y1]] = RECT[r.key];
  const rect = el("rect", { x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: .008, class: "room", "data-i": i });
  rect.addEventListener("click", () => go(i));
  svg.appendChild(rect);
  r.rect = rect; r.at = r.at ?? nearest(center(r.key));
});
Object.entries(OFF).forEach(([k]) => {
  const [[x0, y0], [x1, y1]] = RECT[k];
  svg.appendChild(el("rect", { x: x0, y: y0, width: x1 - x0, height: y1 - y0, class: "room off" }));
});
const label = (k, text, off) => {  // upper third of the room, clear of the walking trail through its middle
  const [[, y0], [, y1]] = RECT[k], [x] = center(k), y = y0 + (y1 - y0) * .28; const t = el("text", { x, y, class: off ? "lbl off" : "lbl" }); t.textContent = text; svg.appendChild(t); };
ROOMS.forEach((r) => label(r.key, r.name, false));
Object.entries(OFF).forEach(([k, n]) => label(k, n, true));
const trail = el("polyline", { class: "trail", points: "" });
const ring = el("circle", { class: "ring", r: .02 });
const dot = el("circle", { class: "dot", r: .018 });
svg.append(trail, ring, dot);
const place = ([x, y]) => { [dot, ring].forEach((c) => { c.setAttribute("cx", x); c.setAttribute("cy", y); }); };

let cur = -1, busy = false;
const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);

function show(i) {
  shots.forEach((s, j) => {
    s.wrap.classList.toggle("on", j === i);
    if (j === i) { s.v.currentTime = 0; s.v.play().catch(() => {}); } else s.v.pause();
  });
  ROOMS.forEach((r, j) => r.rect.classList.toggle("cur", j === i));
  $("name").textContent = ROOMS[i].name;
  const card = $("card"); card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
  cur = i;
}

function go(i) {
  if (busy || i === cur || i < 0 || i >= ROOMS.length) return;
  busy = true;
  const a = ROOMS[cur].at, b = ROOMS[i].at;
  const route = a <= b ? PATH.slice(a, b + 1) : PATH.slice(b, a + 1).reverse();
  // rooms off the tour path walk a straight bridge to it, split into steps so the dot keeps an even speed
  const bridge = (p, q) => Array.from({ length: 13 }, (_, k) => [p[0] + (q[0] - p[0]) * k / 12, p[1] + (q[1] - p[1]) * k / 12]);
  const from = ROOMS[cur].spot, to = ROOMS[i].spot;
  const pts = [...(from ? bridge(from, route[0]) : []), ...route, ...(to ? bridge(route[route.length - 1], to) : [])];
  const dur = Math.min(1700, Math.max(800, pts.length * 16));
  stage.classList.add("travel");
  ROOMS[i].rect.classList.add("dest");
  trail.setAttribute("points", pts.map((p) => p.join(",")).join(" "));
  const t0 = performance.now() + 350;  // let the map grow first
  const step = (now) => {
    const t = Math.min(1, Math.max(0, (now - t0) / dur));
    const f = ease(t) * (pts.length - 1), k = Math.floor(f), u = f - k;
    const p = pts[Math.min(k, pts.length - 1)], q = pts[Math.min(k + 1, pts.length - 1)];
    place([p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u]);
    if (t < 1) return requestAnimationFrame(step);
    setTimeout(() => {
      $("flash").classList.remove("on"); void $("flash").offsetWidth; $("flash").classList.add("on");
      ROOMS[i].rect.classList.remove("dest");
      trail.setAttribute("points", "");
      stage.classList.remove("travel");
      show(i);
      busy = false;
    }, 180);
  };
  requestAnimationFrame(step);
}

// B held: rewind to the first frame and wipe in the Blender render of the same camera (same house, same angle)
const game = (on) => {
  if (on === stage.classList.contains("game") || (on && busy)) return;  // release must always get through
  const v = shots[cur].v;
  if (on) { v.pause(); v.currentTime = 0; } else v.play().catch(() => {});
  stage.classList.toggle("game", on);
};
// physical keys (e.code), so the Thai layout works too
addEventListener("keydown", (e) => {
  if (e.repeat) return;
  const num = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
  if (e.code === "KeyB") game(true);
  else if (e.key === "ArrowRight" || e.key === "ArrowDown") go(cur + 1);
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(cur - 1);
  else if (num) go(+num[1] - 1);
});
addEventListener("keyup", (e) => { if (e.code === "KeyB") game(false); });
addEventListener("blur", () => game(false));  // keyup never arrives if focus leaves while B is held
document.addEventListener("visibilitychange", () => { if (document.hidden) game(false); });

place(PATH[ROOMS[0].at]);
show(0);
</script>
</body>
</html>
